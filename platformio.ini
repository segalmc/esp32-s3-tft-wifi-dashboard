[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Flash - 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio

; Temporary diagnostic configuration without PSRAM
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; Native USB Serial/JTAG
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -include include/TftConfig.h

[env:esp32-s3-n16r8-tft]
extends = env:esp32-s3-n16r8
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
    ${env:esp32-s3-n16r8.build_flags}
    -DTFT_HARDWARE_ENABLED=1
    -DCORE_DEBUG_LEVEL=0

[env:esp32-s3-n16r8-tft-diagnostic]
extends = env:esp32-s3-n16r8-tft
build_flags =
    ${env:esp32-s3-n16r8-tft.build_flags}
    -DNATURE_GLASS_DIAGNOSTICS=1
